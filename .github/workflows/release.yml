name: Release KogaView

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-ubuntu-deb-tar-appimage:
    name: Linux (.deb, .tar.gz, .AppImage + Plugins)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8 & build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build pkg-config python3 git curl ca-certificates \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev libqt6core5compat6-dev \
            qt6-l10n-tools libdav1d-dev libgl1-mesa-dev desktop-file-utils appstream \
            dpkg-dev file librsvg2-bin
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build KogaView Release
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DKOGAVIEW_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/release --target kogaview kogaview_translations -j"$(nproc)"
      - name: Build all 9 standalone plugins
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          for p in rembg upscale utils ocr translate ai-ocr dewatermark caption ai-inpaint; do
            cargo build --manifest-path "plugins/kogaview-plugin-$p/Cargo.toml" --release
          done
      - name: Package .tar.gz, plugins .tar.gz, .deb, and .AppImage
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p dist

          # Render .desktop files from templates
          python3 -c "
          import pathlib
          for name in ('io.github.tienv2i.KogaView.desktop', 'io.github.tienv2i.KogaView.Editor.desktop'):
              tpl = pathlib.Path('packaging/linux/' + name + '.in').read_text()
              pathlib.Path('dist/' + name).write_text(tpl.replace('@BINDIR@', '/usr/bin'))
          "

          # 1. Portable Linux .tar.gz
          STAGE="dist/kogaview-${VER}-linux-x86_64"
          mkdir -p "$STAGE/bin" "$STAGE/share/applications" "$STAGE/share/metainfo" "$STAGE/share/icons/hicolor/scalable/apps"
          install -m755 build/release/bin/kogaview "$STAGE/bin/kogaview"
          install -m644 dist/io.github.tienv2i.KogaView.desktop "$STAGE/share/applications/"
          install -m644 dist/io.github.tienv2i.KogaView.Editor.desktop "$STAGE/share/applications/"
          install -m644 packaging/linux/io.github.tienv2i.KogaView.metainfo.xml "$STAGE/share/metainfo/"
          install -m644 packaging/linux/io.github.tienv2i.KogaView.svg "$STAGE/share/icons/hicolor/scalable/apps/"
          tar -C dist -czf "dist/kogaview-${VER}-linux-x86_64.tar.gz" "kogaview-${VER}-linux-x86_64"

          # 2. All 9 Plugins Bundle .tar.gz
          PSTAGE="dist/kogaview-plugins-${VER}-linux-x86_64"
          declare -A PDIRS=(
            [rembg]=kogaview-rmbg-onnx
            [upscale]=kogaview-upscale-onnx
            [utils]=kogaview-utils
            [ocr]=kogaview-ocr-tesseract
            [translate]=kogaview-translate
            [ai-ocr]=kogaview-ocr-ai
            [dewatermark]=kogaview-dewatermark
            [caption]=kogaview-caption-onnx
            [ai-inpaint]=kogaview-ai-inpaint-onnx
          )
          for p in "${!PDIRS[@]}"; do
            d="$PSTAGE/${PDIRS[$p]}"
            mkdir -p "$d/bin"
            install -m644 "plugins/kogaview-plugin-$p/manifest.json" "$d/manifest.json"
            install -m755 "plugins/kogaview-plugin-$p/target/release/kogaview-plugin-$p" "$d/bin/kogaview-plugin-$p"
          done
          tar -C dist -czf "dist/kogaview-plugins-${VER}-linux-x86_64.tar.gz" "kogaview-plugins-${VER}-linux-x86_64"

          # 3. Debian / Ubuntu .deb
          DEB="dist/deb-root"
          mkdir -p "$DEB/DEBIAN" "$DEB/usr/bin" "$DEB/usr/share/applications" "$DEB/usr/share/metainfo" "$DEB/usr/share/icons/hicolor/scalable/apps"
          install -m755 build/release/bin/kogaview "$DEB/usr/bin/kogaview"
          install -m644 dist/io.github.tienv2i.KogaView.desktop "$DEB/usr/share/applications/"
          install -m644 dist/io.github.tienv2i.KogaView.Editor.desktop "$DEB/usr/share/applications/"
          install -m644 packaging/linux/io.github.tienv2i.KogaView.metainfo.xml "$DEB/usr/share/metainfo/"
          install -m644 packaging/linux/io.github.tienv2i.KogaView.svg "$DEB/usr/share/icons/hicolor/scalable/apps/"
          cat > "$DEB/DEBIAN/control" <<EOF
          Package: kogaview
          Version: ${VER}-1
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: libqt6core6t64 | libqt6core6, libqt6gui6t64 | libqt6gui6, libqt6qml6, libqt6quick6, libqt6svg6, libdav1d7 | libdav1d6
          Maintainer: KogaView Contributors <tienv2i@gmail.com>
          Description: Fast native desktop photo manager, manga reader, editor & AI plugin suite
          EOF
          dpkg-deb --build "$DEB" "dist/kogaview_${VER}-1_amd64.deb"

          # 4. AppImage
          APPDIR="dist/KogaView.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          install -m755 build/release/bin/kogaview "$APPDIR/usr/bin/kogaview"
          install -m644 dist/io.github.tienv2i.KogaView.desktop "$APPDIR/io.github.tienv2i.KogaView.desktop"
          rsvg-convert -w 256 -h 256 packaging/linux/io.github.tienv2i.KogaView.svg -o "$APPDIR/io.github.tienv2i.KogaView.png"
          install -m644 packaging/linux/io.github.tienv2i.KogaView.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/kogaview" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o dist/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x dist/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 dist/appimagetool "$APPDIR" "dist/KogaView-${VER}-x86_64.AppImage"

          # 5. Source archive
          tar --exclude='.git' --exclude='dist' --exclude='build' --exclude='target' \
            --transform="s,^\.,kogaview-${VER}," \
            -czf "dist/kogaview-${VER}-src.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  build-arch-zst:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake ninja pkgconf dav1d rust cargo qt6-base qt6-declarative qt6-svg qt6-5compat qt6-tools python git
      - name: Build .pkg.tar.zst via makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          su - builder -c "cd '$PWD/packaging/arch' && KOGAVIEW_SRC='$PWD' makepkg -f --noconfirm"
          mkdir -p dist
          cp packaging/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-artifacts
          path: dist/*.pkg.tar.zst

  build-fedora-rpm:
    name: Fedora / RPM (.rpm)
    runs-on: ubuntu-24.04
    container:
      image: fedora:41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora RPM build dependencies
        run: |
          dnf install -y rpm-build cmake ninja-build pkgconf-pkg-config gcc-c++ rust cargo \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel qt6-qt5compat-devel \
            qt6-linguist libdav1d-devel python3 git desktop-file-utils
      - name: Build .rpm via rpmbuild
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} dist
          tar --exclude='.git' --exclude='dist' --exclude='build' --exclude='target' \
            --transform="s,^\.,kogaview-${VER}," \
            -czf ~/rpmbuild/SOURCES/kogaview-${VER}.tar.gz .
          cp packaging/rpm/kogaview.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/kogaview.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-artifacts
          path: dist/*.rpm

  build-flatpak:
    name: Flatpak (.flatpak)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak bundle
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=flatpak-repo build-flatpak packaging/flatpak/io.github.tienv2i.KogaView.yml
          flatpak build-bundle flatpak-repo "dist/KogaView-${VER}-x86_64.flatpak" io.github.tienv2i.KogaView
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-artifacts
          path: dist/*.flatpak

  publish-release:
    name: Publish GitHub Release
    needs: [build-ubuntu-deb-tar-appimage, build-arch-zst, build-fedora-rpm, build-flatpak]
    if: always() && (needs.build-ubuntu-deb-tar-appimage.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd all-dist
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "KogaView ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: all-dist/*
