[package]
name = "kogaview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# Format support is the feature list here; everything is compiled in, nothing is
# fetched at runtime. `avif` is the pure-Rust ravif **encoder**; decoding AVIF
# needs `avif-native`, which links the system `libdav1d` (ADR 0005 revision).
# `dds`, `exr`, `ff`, `hdr`, `ico`, `pnm`, `qoi` and `tga` are plain Rust
# decoders.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "avif",
    "avif-native",
    "dds",
    "exr",
    "ff",
    "hdr",
    "ico",
    "pnm",
    "qoi",
    "tga",
] }
kogaview-editor = { path = "../app-editor" }
kogaview-protocol = { path = "../app-protocol" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
