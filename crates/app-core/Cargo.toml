[package]
name = "kogaview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
# Format support is the feature list here; everything is compiled in, nothing is
# fetched at runtime. `avif` brings the pure-Rust ravif encoder and the Rust
# decoder, and `dds`, `exr`, `ff`, `hdr`, `ico`, `pnm`, `qoi` and `tga` are plain
# Rust decoders. `avif-native` is deliberately absent: it links the system
# `libdav1d`, which a Flatpak build would then have to carry and CMake would
# have to be told to link — a packaging decision, not a format decision.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "avif",
    "dds",
    "exr",
    "ff",
    "hdr",
    "ico",
    "pnm",
    "qoi",
    "tga",
] }
# The Editor's first preview is decoded straight to a reduced DCT scale, which
# `image` does not expose: this decoder reads 1/2, 1/4 or 1/8 of a JPEG without
# touching the pixels it throws away. Pure Rust and no threads (`rayon` off), so
# a Flatpak build carries it like the rest.
jpeg-decoder = { version = "0.3", default-features = false }
kogaview-protocol = { path = "../app-protocol" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
