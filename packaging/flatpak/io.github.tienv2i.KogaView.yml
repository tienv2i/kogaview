app-id: io.github.tienv2i.KogaView
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kogaview
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-pictures:rw
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.FileManager1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/kogaview/cargo
modules:
  - name: kogaview
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKOGAVIEW_BUILD_TESTS=OFF
    build-commands:
      - cmake --build . --target kogaview kogaview_translations
    post-install:
      - install -Dm755 bin/kogaview /app/bin/kogaview
      - install -Dm644 ../packaging/linux/io.github.tienv2i.KogaView.metainfo.xml /app/share/metainfo/io.github.tienv2i.KogaView.metainfo.xml
      - install -Dm644 ../packaging/linux/io.github.tienv2i.KogaView.svg /app/share/icons/hicolor/scalable/apps/io.github.tienv2i.KogaView.svg
      - python3 -c "import pathlib; tpl = pathlib.Path('../packaging/linux/io.github.tienv2i.KogaView.desktop.in').read_text(); out = tpl.replace('@EXEC@', 'kogaview').replace('@ICON@', 'io.github.tienv2i.KogaView').replace('@NAME@', 'KogaView').replace('@MIME_TYPES@', 'image/png;image/jpeg;image/webp;image/gif;image/bmp;image/tiff;image/avif;image/x-tga;image/qoi;'); pathlib.Path('/app/share/applications').mkdir(parents=True, exist_ok=True); pathlib.Path('/app/share/applications/io.github.tienv2i.KogaView.desktop').write_text(out)"
    sources:
      - type: dir
        path: ../..
