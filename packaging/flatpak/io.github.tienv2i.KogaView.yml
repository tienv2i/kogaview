app-id: io.github.tienv2i.KogaView
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: kogaview
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-pictures:rw
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.FileManager1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/kogaview/cargo
modules:
  - name: kogaview
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKOGAVIEW_BUILD_TESTS=OFF
    build-commands:
      - cmake --build . --target kogaview kogaview_translations
    post-install:
      - install -Dm755 bin/kogaview /app/bin/kogaview
      - install -Dm644 packaging/linux/io.github.tienv2i.KogaView.metainfo.xml /app/share/metainfo/io.github.tienv2i.KogaView.metainfo.xml
      - install -Dm644 packaging/linux/io.github.tienv2i.KogaView.svg /app/share/icons/hicolor/scalable/apps/io.github.tienv2i.KogaView.svg
      - python3 -c "import pathlib; apps = pathlib.Path('/app/share/applications'); apps.mkdir(parents=True, exist_ok=True); [((apps / n).write_text(pathlib.Path('packaging/linux/' + n + '.in').read_text().replace('@BINDIR@', '/app/bin'))) for n in ('io.github.tienv2i.KogaView.desktop', 'io.github.tienv2i.KogaView.Editor.desktop')]"
    sources:
      - type: dir
        path: ../..
