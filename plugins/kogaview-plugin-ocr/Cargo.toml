[workspace]

[package]
name = "kogaview-plugin-ocr"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Out-of-process OCR (Copy Text from Image) plugin for KogaView using Tesseract + on-demand language packs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
