[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/app-editor",
    "crates/app-protocol",
    "crates/desktop",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
